name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · unit · coverage
    runs-on: ubuntu-latest
    outputs:
      playwright: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # We use `npm install` rather than `npm ci` because the lock file is
      # generated on Windows and certain optional Linux-only deps (@emnapi/*)
      # aren't recorded there. `install` resolves what's actually needed per
      # platform; this is slower but correct cross-platform.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      # e2e runs in the Playwright image for exactly this version
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 14

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    # Browsers and their OS libraries come baked into the image. Installing
    # them with apt on the runner kept stalling for 9-15 minutes and running
    # the job out of time before a single test ran.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.check.outputs.playwright }}-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --prefer-offline

      - name: Build
        run: npm run build

      - name: Run e2e
        env:
          CI: "1"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
